name: Test

on:
  push:
    branches:
      - main
      - beta
      - 'prepare-for-v*'
  pull_request:
    branches:
      - main
      - beta
      - 'prepare-for-v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Repository checks (version, static, hygiene, metainfo)
        run: |
          npm run check:version
          npm run check:static
          npm run check:hygiene
          npm run check:metainfo
          npm run check:release-notes
          npm run test:scripts

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Dart (for fvm bootstrap)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Cache fvm versions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ steps.fvm.outputs.version }}

      - name: Install fvm and pinned Flutter
        run: |
          dart pub global activate fvm
          PUB_BIN="${PUB_CACHE:-$HOME/.pub-cache}/bin"
          echo "$PUB_BIN" >> "$GITHUB_PATH"
          export PATH="$PUB_BIN:$PATH"
          npm run setup:flutter

      - name: Check formatting
        run: npm run format:check

      - name: Analyze
        run: npm run analyze

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate licenses manifest (advisory)
        continue-on-error: true
        run: npm run licenses

      - name: Enforce coverage threshold
        env:
          MIN_COVERAGE: "55"
        run: npm run coverage:check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  build-smoke:
    name: Build smoke (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Dart (for fvm bootstrap)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Cache fvm versions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/fvm/versions
            ~/AppData/Roaming/fvm/versions
          key: fvm-${{ runner.os }}-${{ steps.fvm.outputs.version }}

      - name: Install fvm and pinned Flutter
        shell: bash
        run: |
          dart pub global activate fvm
          if [ -n "$PUB_CACHE" ]; then
            PUB_BIN="${PUB_CACHE//\\//}/bin"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            PUB_BIN="${LOCALAPPDATA//\\//}/Pub/Cache/bin"
          else
            PUB_BIN="$HOME/.pub-cache/bin"
          fi
          echo "$PUB_BIN" >> "$GITHUB_PATH"
          export PATH="$PUB_BIN:$PATH"
          npm run setup:flutter

      - name: Install Linux desktop deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libepoxy-dev libmpv-dev mpv libunwind-dev patchelf xvfb

      - name: Build smoke
        shell: bash
        env:
          CI: "true"
        run: npm run check:build-smoke

      - name: Generate deterministic desktop E2E fixtures
        shell: bash
        run: |
          node scripts/platform-release-smoke.js fixtures \
            --output "test-results/e2e/${{ matrix.os }}/fixtures" \
            --report "test-results/e2e/${{ matrix.os }}/fixture-report.json"

      - name: Run real desktop integration E2E
        shell: bash
        env:
          DACX_E2E_FIXTURE: test-results/e2e/${{ matrix.os }}/fixtures/release-smoke.wav
          DACX_E2E_REPORT: test-results/e2e/${{ matrix.os }}/desktop-playback.json
        run: |
          export DACX_E2E_VERSION="$(node -p \"require('./package.json').version\")"
          export DACX_E2E_RUN_ID="desktop-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}"
          E2E_LOG="test-results/e2e/${{ matrix.os }}/flutter-test.log"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            xvfb-run -a fvm flutter test integration_test/platform_release_smoke_test.dart -d linux 2>&1 | tee "$E2E_LOG"
          else
            fvm flutter test integration_test/platform_release_smoke_test.dart -d "${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}" 2>&1 | tee "$E2E_LOG"
          fi
          grep -Eq 'All tests passed!?' "$E2E_LOG"
          if grep -Eq 'Some tests failed|Failed to load|[+][0-9]+ -[1-9][0-9]*:' "$E2E_LOG"; then
            exit 1
          fi

      - name: Upload desktop E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: test-results/e2e/${{ matrix.os }}
          if-no-files-found: warn

      - name: Build macOS XPC update helper
        if: matrix.os == 'macos-latest'
        shell: bash
        run: npm run check:mac:xpc-helper
