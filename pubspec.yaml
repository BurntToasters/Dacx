name: dacx
description: "Quick, lightweight cross-platform media player."
publish_to: 'none'
version: 1.0.0-beta.1+10000

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  anni_mpris_service: ^0.1.0
  crypto: ^3.0.7
  cryptography_plus: ^3.0.0
  # desktop_drop 0.8.4 currently pins dbus <0.8; keep latest compatible
  # release until desktop_drop publishes a dbus 0.8-compatible version.
  dbus: ^0.7.15
  desktop_drop: ^0.8.4
  ffi: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_acrylic: ^1.1.4
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.2
  macos_window_utils: ^1.9.1
  media_kit: ^1.2.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  tray_manager: ^0.7.0
  url_launcher: ^6.3.1
  window_manager: ^0.5.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cacert.pem
    - assets/icon/icon.png
    - assets/icon/icon.ico
    - assets/icon/tray_icon_template.png
